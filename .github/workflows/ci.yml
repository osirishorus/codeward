name: CI

on:
  push:
  pull_request:

jobs:
  test-build:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          # setuptools is the build backend (pyproject `build-system.requires`)
          # but Python 3.12+ runners no longer preinstall it, and our
          # `test_package_metadata_*` test imports `setuptools.build_meta`
          # directly. Pin it in the test env so the test isn't environment-flaky.
          python -m pip install -e . pytest build twine setuptools ruff

      - name: Smoke CLI
        run: |
          codeward --version
          codeward --help

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run npm wrapper tests
        run: node --test npm/test/*.js

      - name: Ruff
        run: ruff check .

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Smoke installed wheel
        run: |
          python -m venv /tmp/codeward-wheel-test
          /tmp/codeward-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/codeward-wheel-test/bin/python -m pip install dist/codeward-*.whl
          /tmp/codeward-wheel-test/bin/codeward --version
          /tmp/codeward-wheel-test/bin/codeward --help
