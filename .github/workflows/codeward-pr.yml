name: Codeward PR report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  codeward-pr-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Codeward PR report
        uses: ./
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          from-source: "true"
          security: "true"
          comment: "true"
